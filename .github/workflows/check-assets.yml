# The stylesheet and scripts carry a content hash in their filenames and are
# served with a one-day cache plus a week of stale-while-revalidate. That is
# only safe while the hash is true. Edit one in place and returning visitors
# keep the old bytes for a day or more — and if the HTML changed with it, they
# see a broken page that looks fine in a fresh browser.
#
# This fails the moment a name stops matching its contents.
name: Check asset hashes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every hashed filename must match its bytes
        run: python3 tools/rehash-assets.py --check

      - name: The directory page must match data/directory.json
        run: python3 tools/build-directory.py --check

      - name: The event pages must match data/events.json
        run: python3 tools/build-event-pages.py --check

      # Every event page's header and footer are copied from 404/index.html
      # by the builder, and 404.html is the copy Vercel actually serves.
      # They are the same file twice; nothing but this says so.
      - name: The two copies of the 404 page must be identical
        run: |
          if ! cmp -s 404.html 404/index.html; then
            echo "404.html and 404/index.html have drifted apart:"
            diff 404.html 404/index.html || true
            echo
            echo "404/index.html is the header and footer template for every"
            echo "event page; 404.html is what Vercel serves. Edit both."
            exit 1
          fi
          echo "404.html and 404/index.html are identical."
