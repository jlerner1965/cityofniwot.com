<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Niwot">
  <!-- The masthead in miniature: the serif N over the caboose-red rule that
       sits under the wordmark on every page. Drawn as shapes rather than
       <text>, so the letter cannot land on whatever serif a device happens
       to have. Palette is the 2026 refresh: evergreen #173F3A, red #A64F32. -->
  <rect width="32" height="32" fill="#173F3A"/>
  <g fill="#FFFEFD">
    <rect x="6.2" y="3.6" width="2.8" height="19.4"/>
    <rect x="23.0" y="3.6" width="2.8" height="19.4"/>
    <polygon points="6.2,3.6 11.6,3.6 25.8,23 20.4,23"/>
    <rect x="4.0" y="3.6" width="7.2" height="1.7"/>
    <rect x="4.0" y="21.3" width="7.2" height="1.7"/>
    <rect x="20.8" y="3.6" width="7.2" height="1.7"/>
    <rect x="20.8" y="21.3" width="7.2" height="1.7"/>
  </g>
  <rect y="27.2" width="32" height="3" fill="#A64F32"/>
</svg>
